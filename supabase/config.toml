# ─────────────────────────────────────────────────────────────
# NexusCRM – Supabase Local Development Configuration
# ─────────────────────────────────────────────────────────────
# This file configures the Supabase CLI for local development.
# Run `supabase start` to spin up a local Supabase instance.
# ─────────────────────────────────────────────────────────────

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = false

[auth.email]
enable_confirmations = false
enable_autoconfirm = true

[edge_runtime]
enabled = true
policy = "per_worker"

[analytics]
enabled = false
